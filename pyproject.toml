[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "changeledger"
version = "0.1.0"
description = "Visual change detection baseline for before-and-after images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "Pillow",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["changeledger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
